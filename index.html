<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>زفاف مصطفى ورانيا</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap">
<style>
:root{
  --bg:#0a1611;
  --bg-glow:#152e22;
  --ivory:#F7EFE6;
  --ivory-dim:rgba(247,239,230,.8);
  --blush:#EBB7C1;
  --rose:#A8455E;
  --gold:#D4AF37;
  --gold-light:#f7e8b5;
  --paper:rgba(252,248,242,.95);
  --ink:#122019;
  --ink-dim:#4a6155;
  --line:rgba(212,175,55,.4);
  --wall:rgba(235,183,193,.9);
  --trail:rgba(217,130,148,.6);
  --disp:"Aref Ruqaa","Amiri",serif;
  --text:"Tajawal",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%;scroll-behavior:smooth}
body{
  margin:0;background-color:var(--bg);color:var(--ivory);
  font-family:var(--text);font-size:17px;line-height:1.8;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(circle at 50% -10%,var(--bg-glow) 0%,transparent 70%),
    radial-gradient(circle at 100% 100%,rgba(212,175,55,.12) 0%,transparent 60%),
    var(--bg);
}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

.bar{
  position:fixed;z-index:50;direction:ltr;pointer-events:none;
  top:calc(12px + env(safe-area-inset-top,0px));
  left:max(14px,env(safe-area-inset-left,0px));
  right:max(14px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:center;
}
.bar > *{pointer-events:auto}
.pill{
  height:44px;min-width:44px;padding:0 18px;border-radius:24px;
  border:1px solid var(--line);background:rgba(10,22,17,.8);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  color:var(--ivory);display:inline-flex;align-items:center;justify-content:center;gap:8px;
  cursor:pointer;font-size:15px;transition:all .3s cubic-bezier(.4,0,.2,1);
  box-shadow:0 8px 25px rgba(0,0,0,.3);
}
.pill:hover{background:rgba(21,46,34,.95);border-color:var(--gold);transform:translateY(-2px)}
.pill svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.screen{
  position:fixed;inset:0;z-index:20;overflow-y:auto;display:flex;flex-direction:column;text-align:center;
  padding:calc(80px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  transition:opacity .8s cubic-bezier(.4,0,.2,1),visibility .8s;
  background:rgba(10,22,17,.97);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
}
.screen.off{opacity:0;visibility:hidden;pointer-events:none}
.screen .inner{margin:auto;width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:20px}

.eyebrow{font-size:16px;color:var(--gold);font-weight:500;letter-spacing:1px}
.names{display:flex;flex-direction:column;align-items:center;font-family:var(--disp);line-height:1.2}
.nm{font-size:clamp(60px,18vw,105px);color:var(--ivory);font-weight:700;text-shadow:0 10px 30px rgba(0,0,0,.4)}
.amp{font-size:clamp(28px,8vw,42px);color:var(--gold);font-style:italic;line-height:1.2}
.orn{display:flex;align-items:center;gap:16px;color:var(--gold)}
.orn::before,.orn::after{content:"";width:60px;height:1px;background:var(--line)}
.date-line{font-size:19px;color:var(--ivory-dim)}
.teaser{max-width:32ch;color:var(--ivory-dim);font-size:16px}
.small{font-size:14px;color:var(--ivory-dim)}

.btn{
  border:0;cursor:pointer;border-radius:999px;padding:15px 40px;font-weight:500;font-size:18px;
  background:linear-gradient(135deg,var(--blush),#d49ba6);color:var(--ink);
  transition:all .3s cubic-bezier(.4,0,.2,1);box-shadow:0 10px 30px rgba(235,183,193,.3);
}
.btn:hover{transform:translateY(-3px);box-shadow:0 15px 35px rgba(235,183,193,.5)}
.btn.glow{animation:magicGlow 2.5s ease-in-out infinite}
.btn.dark{background:linear-gradient(135deg,#1f382b,#122019);color:var(--ivory);border:1px solid var(--line)}
.btn.dark:hover{background:linear-gradient(135deg,#284737,#1b3125)}
.btn.ghost{background:transparent;color:var(--ivory);box-shadow:inset 0 0 0 1px var(--gold)}
.btn.ghost:hover{background:rgba(212,175,55,.1)}
.btn.sm{padding:11px 24px;font-size:15px}
.link{background:none;border:0;cursor:pointer;color:var(--gold-light);text-decoration:underline;text-underline-offset:6px;font-size:14px;padding:6px}

@keyframes magicGlow{
  0%,100%{box-shadow:0 0 0 0 rgba(235,183,193,.4),0 10px 30px rgba(235,183,193,.2)}
  50%{box-shadow:0 0 0 18px rgba(235,183,193,0),0 15px 40px rgba(235,183,193,.5)}
}

.maze-title{font-family:var(--disp);font-size:clamp(30px,8vw,42px);color:var(--ivory);font-weight:700}
.card-maze{padding:12px;border-radius:24px;border:1px solid var(--line);background:rgba(247,239,230,.04);box-shadow:0 25px 60px rgba(0,0,0,.5);animation:floatCard 4s ease-in-out infinite}
@keyframes floatCard{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#maze{display:block;touch-action:none;border-radius:16px}

/* Directional Buttons for Maze */
.maze-controls{display:grid;grid-template-columns:repeat(3,55px);gap:8px;justify-content:center;margin-top:12px}
.m-btn{
  width:55px;height:48px;border-radius:14px;border:1px solid var(--line);
  background:rgba(21,46,34,.8);color:var(--ivory);font-size:20px;cursor:pointer;
  display:grid;place-items:center;transition:all .2s;box-shadow:0 4px 15px rgba(0,0,0,.3);
}
.m-btn:hover{background:var(--gold);color:var(--ink);border-color:var(--gold);transform:scale(1.05)}
.m-btn:active{transform:scale(0.95)}
.m-btn.empty{visibility:hidden;pointer-events:none}

.row-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.win{font-family:var(--disp);font-size:28px;color:var(--blush);animation:bounce 1s infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}

#invite{position:relative;z-index:10;max-width:620px;margin:0 auto;padding-top:60px}
.sec{padding-block:50px;text-align:center}
.arch{
  width:min(76vw,300px);aspect-ratio:3/4;margin:0 auto 32px;border-radius:999px 999px 28px 28px;overflow:hidden;
  box-shadow:0 0 0 1px var(--line),0 0 0 10px rgba(10,22,17,1),0 0 0 11px var(--line),0 30px 70px rgba(0,0,0,.6);
  animation:pulseArch 6s ease-in-out infinite;
}
@keyframes pulseArch{0%,100%{box-shadow:0 0 0 1px var(--line),0 0 0 10px rgba(10,22,17,1),0 0 0 11px var(--line),0 30px 70px rgba(0,0,0,.6)}50%{box-shadow:0 0 0 1px var(--gold),0 0 0 10px rgba(10,22,17,1),0 0 0 12px var(--gold),0 35px 80px rgba(212,175,55,.25)}}
.arch img{width:100%;height:100%;object-fit:cover;object-position:52% 40%;display:block;transition:transform .8s}
.arch:hover img{transform:scale(1.05)}

.invite-line{color:var(--ivory-dim);margin-bottom:8px;font-size:18px}
.hero-date{font-family:var(--disp);font-size:clamp(28px,7vw,36px);color:var(--gold-light);margin-top:14px}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:420px;margin:28px auto 0}
.cd{border:1px solid var(--line);border-radius:18px;padding:14px 4px 10px;background:rgba(247,239,230,.04);backdrop-filter:blur(8px)}
.cd b{display:block;font-size:32px;font-weight:500;color:var(--blush);font-variant-numeric:tabular-nums}
.cd span{font-size:13px;color:var(--ivory-dim)}
.count-note{margin-top:18px;font-family:var(--disp);font-size:24px;color:var(--blush)}

.verse{font-family:var(--disp);font-size:clamp(23px,5.8vw,30px);line-height:2.1;color:var(--ivory);max-width:26em;margin:0 auto;text-shadow:0 5px 20px rgba(0,0,0,.4)}
.verse-src{margin-top:14px;font-size:15px;color:var(--gold)}

h2.h{font-family:var(--disp);font-size:clamp(32px,8vw,42px);font-weight:700;margin-bottom:8px;color:var(--ink)}
.h-sub{color:var(--ink-dim);margin-bottom:26px;font-size:16px}

/* Enhanced Magic Paper Cards */
.paper{
  color-scheme:light;position:relative;background:var(--paper);color:var(--ink);
  border-radius:32px;padding:40px 28px 36px;text-align:start;
  box-shadow:0 30px 90px rgba(0,0,0,.5);border:1px solid rgba(212,175,55,.4);
  backdrop-filter:blur(10px);
}
.paper::before{
  content:"";position:absolute;inset:10px;border:1px solid rgba(212,175,55,.45);
  border-radius:24px;pointer-events:none;
}
.paper h2.h,.paper .h-sub{text-align:center;color:var(--ink)}
.rows{display:grid;margin:10px 0 24px}
.rw{display:grid;grid-template-columns:95px minmax(0,1fr);gap:14px;padding:15px 0;border-top:1px solid rgba(18,32,25,.12)}
.rw:first-child{border-top:0}
.rw dt{color:var(--rose);font-size:15px;font-weight:600;padding-top:2px}
.rw dd{margin:0;font-size:18px;line-height:1.6;font-weight:500;color:var(--ink)}

/* Clean Full-Width Modern Gallery */
.gal{
  position:relative;border-radius:30px;overflow:hidden;aspect-ratio:4/5;
  max-width:520px;margin:0 auto;background:#06100b;
  box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(0,0,0,.6);
}
.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;position:relative;scroll-snap-align:center;overflow:hidden}
.slide .bgi{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(30px) brightness(.5) saturate(1.4)}
.slide img{position:relative;display:block;width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.4,0,.2,1)}
.slide:hover img{transform:scale(1.03)}
.nav{
  position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;
  border:1px solid rgba(247,239,230,.5);background:rgba(10,22,17,.7);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ivory);
  cursor:pointer;display:grid;place-items:center;z-index:3;transition:all .3s cubic-bezier(.4,0,.2,1);
}
.nav:hover{background:rgba(21,46,34,.95);border-color:var(--gold);transform:translateY(-50%) scale(1.1)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
html[dir="rtl"] .nav svg{transform:scaleX(-1)}
.nav.prev{inset-inline-start:14px}.nav.next{inset-inline-end:14px}
.dots{display:flex;justify-content:center;gap:10px;margin-top:20px}
.dots button{width:10px;height:10px;padding:0;border-radius:50%;border:0;background:rgba(247,239,230,.35);cursor:pointer;transition:all .4s}
.dots button[aria-current="true"]{background:var(--blush);width:32px;border-radius:6px;box-shadow:0 0 15px rgba(235,183,193,.6)}

/* Magical Form & Inputs */
form{display:grid;gap:22px}
label.fl,.fl{display:block;font-size:16px;font-weight:600;margin-bottom:8px;color:var(--ink)}
.in{
  width:100%;border:1.5px solid #d4c4b0;background:#ffffff;border-radius:18px;
  padding:15px 20px;font:inherit;font-size:17px;color:var(--ink);line-height:1.5;
  box-shadow:0 6px 20px rgba(0,0,0,.04);transition:all .3s cubic-bezier(.4,0,.2,1);
}
.in:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 5px rgba(168,69,94,.15),0 8px 25px rgba(0,0,0,.08)}
textarea.in{min-height:110px;resize:vertical}
.choice{display:grid;gap:14px}
.choice label{
  display:flex;align-items:center;gap:16px;border:1.5px solid #d4c4b0;background:#ffffff;
  border-radius:18px;padding:15px 20px;cursor:pointer;font-size:17px;font-weight:600;color:var(--ink);
  transition:all .3s cubic-bezier(.4,0,.2,1);box-shadow:0 6px 20px rgba(0,0,0,.04);
}
.choice input{accent-color:var(--rose);width:22px;height:22px;margin:0;flex:none}
.choice label:has(input:checked){border-color:var(--rose);background:#fcf0f2;box-shadow:0 8px 25px rgba(168,69,94,.2);transform:translateY(-1px)}
.stepper{display:inline-flex;align-items:center;border:1.5px solid #d4c4b0;border-radius:18px;background:#ffffff;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.04)}
.stepper button{width:52px;height:52px;border:0;background:transparent;cursor:pointer;font-size:26px;font-weight:bold;color:var(--ink);transition:background .2s}
.stepper button:hover{background:#f4ebd9}
.stepper output{min-width:64px;text-align:center;font-size:21px;font-weight:bold;color:var(--ink);font-variant-numeric:tabular-nums}
.err{color:var(--rose);font-size:15px;min-height:1.4em;font-weight:600}
.reply{display:grid;gap:16px;text-align:center}
.reply textarea{width:100%;min-height:130px;border:1.5px solid #d4c4b0;border-radius:18px;background:#ffffff;padding:16px;font:inherit;font-size:16px;color:var(--ink);line-height:1.7;text-align:start}
.reply .note{color:var(--ink-dim);font-size:15px}

/* Developer Credit Badge */
.dev-credit {
  margin-top: 40px;
  padding: 16px 24px;
  background: rgba(10, 22, 17, 0.9);
  border: 1px solid var(--line);
  border-radius: 22px;
  display: inline-block;
  font-size: 15px;
  color: var(--ivory-dim);
  box-shadow: 0 15px 40px rgba(0,0,0,.4);
  backdrop-filter: blur(12px);
}
.dev-credit b {
  color: var(--gold);
}
.dev-credit a {
  color: var(--blush);
  text-decoration: none;
  font-weight: bold;
}

footer.end{padding:50px 0 calc(60px + env(safe-area-inset-bottom,0px));text-align:center}
footer.end .names2{font-family:var(--disp);font-size:36px;color:var(--ivory)}
footer.end .d{margin-top:8px;color:var(--gold);letter-spacing:.25em;font-size:14px}

.rise{transition:opacity 1s cubic-bezier(.4,0,.2,1),transform 1s cubic-bezier(.4,0,.2,1)}
.rise.pre{opacity:0;transform:translateY(35px)}
body.open .ha{animation:up 1s cubic-bezier(.2,.7,.2,1) both}
body.open .ha1{animation-delay:.2s}body.open .ha2{animation-delay:.45s}body.open .ha3{animation-delay:.7s}body.open .ha4{animation-delay:.95s}
@keyframes up{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}

@media (max-width:380px){.rw{grid-template-columns:1fr;gap:4px}.cd b{font-size:26px}}
</style>
</head>
<body>

<audio id="song" src="song.mp3" loop preload="metadata"></audio>
<canvas class="fx" id="petals" aria-hidden="true"></canvas>
<canvas class="fx" id="burst" aria-hidden="true"></canvas>

<div class="bar">
  <button class="pill" id="musicBtn" type="button" aria-pressed="false" data-aria="musicLabel">
    <svg id="icOn" viewBox="0 0 24 24" hidden><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    <svg id="icOff" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></svg>
  </button>
  <button class="pill" id="langBtn" type="button"></button>
</div>

<!-- 1. intro -->
<section class="screen" id="intro" aria-labelledby="introNames">
  <div class="inner">
    <p class="eyebrow a a1" data-t="eyebrow"></p>
    <h1 class="names a a2" id="introNames"><span class="nm" data-t="groom"></span><span class="amp">&amp;</span><span class="nm" data-t="bride"></span></h1>
    <div class="orn a a3"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
    <p class="date-line a a3" data-t="dateLine"></p>
    <p class="teaser a a4" data-t="teaser"></p>
    <button class="btn glow a a5" id="startBtn" type="button" data-t="start"></button>
    <p class="small a a6" data-t="soundNote"></p>
    <button class="link a a6" id="skipBtn" type="button" hidden data-t="skip"></button>
  </div>
</section>

<!-- 2. maze -->
<section class="screen off" id="mazeScr" aria-labelledby="mazeTitle">
  <div class="inner">
    <h2 class="maze-title a a1" id="mazeTitle" data-t="mazeTitle"></h2>
    <p class="small a a2" id="mazeHelp" data-t="mazeHelp" style="max-width:32ch"></p>
    <p class="win" id="winMsg" role="status" hidden></p>
    <div class="card-maze a a3">
      <canvas id="maze" aria-label="maze"></canvas>
    </div>
    <!-- Directional Controls for Maze -->
    <div class="maze-controls a a3">
      <div class="m-btn empty"></div>
      <button class="m-btn" id="btnUp" aria-label="أعلى">⬆</button>
      <div class="m-btn empty"></div>
      <button class="m-btn" id="btnLeft" aria-label="يسار">⬅</button>
      <button class="m-btn" id="btnDown" aria-label="أسفل">⬇</button>
      <button class="m-btn" id="btnRight" aria-label="يمين">➡</button>
    </div>
    <div class="row-btns a a4" style="margin-top:10px">
      <button class="pill" id="hintBtn" type="button" data-t="hint"></button>
      <button class="pill" id="resetBtn" type="button" data-t="reset"></button>
    </div>
  </div>
</section>

<!-- 3. invitation -->
<main id="invite" hidden>
  <section class="sec" style="padding-top:10px">
    <div class="arch ha ha1"><img src="g4.jpg" alt="" data-alt="1"></div>
    <p class="invite-line ha ha2" data-t="inviteLine"></p>
    <h2 class="names ha ha2" style="margin-top:4px"><span class="nm" data-t="groom"></span><span class="amp">&amp;</span><span class="nm" data-t="bride"></span></h2>
    <p class="hero-date ha ha3" data-t="fullDate"></p>
    <div class="count ha ha4" id="count" aria-live="off"></div>
    <p class="count-note" id="countNote" hidden></p>
  </section>

  <section class="sec rise">
    <div class="orn" style="justify-content:center;margin-bottom:24px"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
    <p class="verse" lang="ar" dir="rtl">وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً</p>
    <p class="verse-src" data-t="verseSrc"></p>
  </section>

  <section class="sec rise">
    <div class="paper">
      <h2 class="h" data-t="detailsH"></h2>
      <p class="h-sub" data-t="detailsSub">نتشرف بحضوركم وفرحتكم معنا في قاعة النخيل</p>
      
      <!-- Embedded Google Map Box -->
      <div style="width:100%;height:190px;border-radius:20px;overflow:hidden;margin-bottom:22px;border:1px solid rgba(18,32,25,.2);box-shadow:0 8px 25px rgba(0,0,0,.08)">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3454.0!2d31.2357!3d30.0444!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzDCsDAyJzM5LjgiTiAzMcKwMTQnMDguNSJF!5e0!3m2!1sen!2seg!4v1600000000000!5m2!1sen!2seg" style="width:100%;height:100%;border:0" allowfullscreen="" loading="lazy"></iframe>
      </div>

      <dl class="rows">
        <div class="rw"><dt data-t="lDate"></dt><dd data-t="fullDate"></dd></div>

  ctx.stroke();ctx.restore();
  var gx=ccx(COLS-1),gy=ccx(ROWS-1),R=cs*.4,pulse=1+.07*Math.sin(t/320);
  ctx.save();ctx.globalAlpha=.35;ctx.strokeStyle=col.blush;ctx.lineWidth=2;ctx.beginPath();ctx.arc(gx,gy,R*1.35*pulse,0,6.283);ctx.stroke();ctx.restore();
  avatar(imgB,gx,gy,R,col.blush);
  if(!won){ctx.fillStyle="#D98294";heartPath(ctx,gx,gy-R-8-Math.sin(t/380)*2.5,cs*.13);ctx.fill()}
  avatar(imgG,ccx(ax),ccx(ay),R,col.gold);
}
function step(dx,dy){
  if(won||!canMove(cx,cy,dx,dy))return false;
  cx+=dx;cy+=dy;var L=trail.length;
  if(L>=2&&trail[L-2][0]===cx&&trail[L-2][1]===cy)trail.pop();else trail.push([cx,cy]);
  if(cx===COLS-1&&cy===ROWS-1)win();
  return true;
}
function toward(tx,ty){
  var guard=0;
  while((cx!==tx||cy!==ty)&&guard++<10&&!won){
    var ddx=tx-cx,ddy=ty-cy,sx=Math.sign(ddx),sy=Math.sign(ddy);
    var order=Math.abs(ddx)>=Math.abs(ddy)?[[sx,0],[0,sy]]:[[0,sy],[sx,0]],moved=false;
    for(var i=0;i<2;i++){var m=order[i];if((m[0]||m[1])&&step(m[0],m[1])){moved=true;break}}
    if(!moved)break;
  }
}
function pointerCell(e){
  var r=cv.getBoundingClientRect();
  var x=Math.floor((e.clientX-r.left-PAD)/cs),y=Math.floor((e.clientY-r.top-PAD)/cs);
  return [Math.max(0,Math.min(COLS-1,x)),Math.max(0,Math.min(ROWS-1,y))];
}
var dragging=false;
cv.addEventListener("pointerdown",function(e){dragging=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}var c=pointerCell(e);toward(c[0],c[1])});
cv.addEventListener("pointermove",function(e){if(!dragging)return;var c=pointerCell(e);toward(c[0],c[1])});
["pointerup","pointercancel"].forEach(function(n){cv.addEventListener(n,function(){dragging=false})});

// Directional Buttons Actions
$("#btnUp").addEventListener("click",function(){step(0,-1)});
$("#btnDown").addEventListener("click",function(){step(0,1)});
$("#btnLeft").addEventListener("click",function(){step(-1,0)});
$("#btnRight").addEventListener("click",function(){step(1,0)});

document.addEventListener("keydown",function(e){
  if(!mazeActive)return;
  var m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
  if(m){e.preventDefault();step(m[0],m[1])}
});
$("#hintBtn").addEventListener("click",function(){hintPath=solve(cx,cy);hintUntil=performance.now()+4500});
$("#resetBtn").addEventListener("click",function(){if(won)return;cx=cy=0;ax=ay=0;trail=[[0,0]];hintPath=null});

var intro=$("#intro"),mazeScr=$("#mazeScr");
function showMaze(){
  intro.classList.add("off");mazeScr.classList.remove("off");mazeActive=true;layoutMaze();
}
$("#startBtn").addEventListener("click",function(){setMusic(true);showMaze()});
try{if(localStorage.getItem("solved")==="1")$("#skipBtn").hidden=false}catch(e){}
$("#skipBtn").addEventListener("click",function(){setMusic(true);openInvite()});

var inviteOpen=false;
function win(){
  won=true;
  setTimeout(function(){
    var r=cv.getBoundingClientRect();
    burstAt(r.left+ccx(COLS-1),r.top+ccx(ROWS-1));
    var w=$("#winMsg");w.textContent=T[lang].winMsg;w.hidden=false;$("#mazeHelp").hidden=true;
    try{localStorage.setItem("solved","1")}catch(e){}
  },380);
  setTimeout(function(){burstAt(window.innerWidth/2,window.innerHeight*.55)},1300);
  setTimeout(openInvite,3300);
}

function openInvite(){
  if(inviteOpen)return;inviteOpen=true;mazeActive=false;
  intro.classList.add("off");mazeScr.classList.add("off");
  $("#invite").hidden=false;document.body.classList.add("open");
  window.scrollTo(0,0);
  buildCountShell();renderCount();setInterval(renderCount,1000);
  setupReveal();setupGallery();
}

var target=new Date(EVENT.startISO).getTime();
function buildCountShell(){
  var d=T[lang],box=$("#count");if(!box)return;
  var keys=["cdD","cdH","cdM","cdS"];
  box.innerHTML="";
  keys.forEach(function(k){var c=document.createElement("div");c.className="cd";c.innerHTML="<b>0</b><span></span>";c.lastChild.textContent=d[k];box.appendChild(c)});
}
function renderCount(){
  var box=$("#count"),note=$("#countNote");if(!box||!box.children.length)return;
  var now=Date.now(),diff=target-now,d=T[lang];
  if(diff<=0){
    box.hidden=true;note.hidden=false;note.textContent=(now<target+216e5)?d.today:d.after;return;
  }
  box.hidden=false;note.hidden=true;
  var s=Math.floor(diff/1000),dd=Math.floor(s/86400),hh=Math.floor(s%86400/3600),mm=Math.floor(s%3600/60),ss=s%60;
  var v=[dd,hh,mm,ss];
  for(var i=0;i<4;i++)box.children[i].firstChild.textContent=num(v[i],i>0);
}

function setupReveal(){
  var els=$$(".rise");
  if(!("IntersectionObserver" in window))return;
  var io=new IntersectionObserver(function(en){
    en.forEach(function(e){if(e.isIntersecting){e.target.classList.remove("pre");io.unobserve(e.target)}});
  },{threshold:.1});
  els.forEach(function(el){
    if(el.getBoundingClientRect().top>window.innerHeight*.9){el.classList.add("pre");io.observe(el)}
  });
}

var track=$("#track"),slides=$$(".slide"),dots=$("#dots"),galIdx=0,galVisible=false,galUser=false,galTimer=null;
function sgn(){return document.documentElement.dir==="rtl"?-1:1}
function jumpTo(i,smooth){
  galIdx=(i+slides.length)%slides.length;
  track.scrollTo({left:sgn()*galIdx*track.clientWidth,behavior:smooth?"smooth":"auto"});
  markDots();
}
function markDots(){
  $$("button",dots).forEach(function(b,i){if(i===galIdx)b.setAttribute("aria-current","true");else b.removeAttribute("aria-current")});
}
function setupGallery(){
  dots.innerHTML="";
  slides.forEach(function(_,i){
    var b=document.createElement("button");b.type="button";b.setAttribute("aria-label",String(i+1));
    b.addEventListener("click",function(){galUser=true;jumpTo(i,true)});dots.appendChild(b);
  });
  markDots();
  var t=null;
  track.addEventListener("scroll",function(){
    clearTimeout(t);t=setTimeout(function(){
      var w=track.clientWidth;if(!w)return;galIdx=Math.max(0,Math.min(slides.length-1,Math.round(Math.abs(track.scrollLeft)/w)));markDots();
    },60);
  },{passive:true});
  ["pointerdown","wheel","keydown","touchstart"].forEach(function(n){track.addEventListener(n,function(){galUser=true},{passive:true})});
  $("#prev").addEventListener("click",function(){galUser=true;jumpTo(galIdx-1,true)});
  $("#next").addEventListener("click",function(){galUser=true;jumpTo(galIdx+1,true)});
  if("IntersectionObserver" in window){
    new IntersectionObserver(function(en){galVisible=en[0].isIntersecting},{threshold:.5}).observe($("#gal"));
  }
  if(!RM)galTimer=setInterval(function(){if(galVisible&&!galUser&&!document.hidden)jumpTo(galIdx+1,true)},4500);
}

var guests=1;
function setGuests(n){guests=Math.max(1,Math.min(10,n));$("#gOut").textContent=num(guests)}
$("#gMinus").addEventListener("click",function(){setGuests(guests-1)});
$("#gPlus").addEventListener("click",function(){setGuests(guests+1)});
function attending(){return $("#att-yes").checked}
$$("input[name=att]").forEach(function(r){r.addEventListener("change",function(){$("#guestsBox").hidden=!attending()})});
var lastMsg="";
function buildReply(){
  var name=$("#rsvp-name").value.trim(),note=$("#rsvp-msg").value.trim();
  lastMsg=T[lang].msg({name:name,att:attending(),n:num(guests),note:note});
  $("#replyText").value=lastMsg;
  var share=$("#waShareLink");
  share.href="https://wa.me/201203524383?text="+encodeURIComponent(lastMsg);
  share.textContent=T[lang].waShare;
}
$("#rsvpForm").addEventListener("submit",function(e){
  e.preventDefault();
  if(!$("#rsvp-name").value.trim()){$("#rsvpErr").textContent=T[lang].errName;$("#rsvp-name").focus();return}
  $("#rsvpErr").textContent="";buildReply();
  $("#rsvpForm").hidden=true;$("#reply").hidden=false;
});
$("#editBtn").addEventListener("click",function(){$("#reply").hidden=true;$("#rsvpForm").hidden=false;$("#rsvp-name").focus()});
$("#copyBtn").addEventListener("click",function(){
  var b=$("#copyBtn"),ta=$("#replyText");
  function done(ok){b.textContent=ok?T[lang].copied:T[lang].copyManual;if(!ok){ta.focus();ta.select()}setTimeout(function(){b.textContent=T[lang].copy},2200)}
  try{navigator.clipboard.writeText(lastMsg).then(function(){done(true)},function(){done(false)})}catch(e){done(false)}
});

applyLang(lang);setGuests(1);readCols();sizeFx();initPetals();layoutMaze();
var rt=null;
window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){sizeFx();initPetals();layoutMaze();if(inviteOpen)jumpTo(galIdx)},150)});
var last=performance.now();
function loop(t){
  var dt=Math.min(.05,(t-last)/1000);last=t;
  if(!document.hidden){stepFx(dt,t);if(mazeActive||(won&&!inviteOpen))drawMaze(t,dt)}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
