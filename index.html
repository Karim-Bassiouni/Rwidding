<title>زفاف مصطفى ورانيا</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500;1,600&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: a dark-green night scene taken from the wedding decor (green velvet, pink blossom).
   Intro -> hand-drawn-feel maze -> scrolling invitation on ivory paper cards. */
:root{
  --bg:#13231A;
  --bg-lift:#223f2e;
  --ivory:#F7EFE6;
  --ivory-dim:rgba(247,239,230,.74);
  --blush:#EBB7C1;
  --rose:#A8455E;
  --gold:#C9A66B;
  --gold-deep:#80622C;
  --paper:#F8F1E8;
  --ink:#1F3226;
  --ink-dim:#566759;
  --line:rgba(201,166,107,.38);
  --wall:rgba(235,183,193,.88);
  --trail:rgba(217,130,148,.5);
  --f-ar-d:"Aref Ruqaa","Amiri",serif;
  --f-ar:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-en-d:"Cormorant Garamond",Georgia,serif;
  --f-en:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  --disp:var(--f-ar-d);
  --text:var(--f-ar);
  color-scheme:dark;
}
html[lang="en"]{--disp:var(--f-en-d);--text:var(--f-en)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  background-color:var(--bg);
  color:var(--ivory);
  font-family:var(--text);
  font-size:17px;
  line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(120% 70% at 50% -10%,var(--bg-lift) 0%,transparent 60%),
    radial-gradient(70% 50% at 100% 100%,rgba(235,183,193,.12) 0%,transparent 70%),
    var(--bg);
}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#petals{z-index:0}
#burst{z-index:30}

/* top controls */
.bar{
  position:fixed;z-index:40;direction:ltr;pointer-events:none;
  top:calc(10px + env(safe-area-inset-top,0px));
  left:max(14px,env(safe-area-inset-left,0px));
  right:max(14px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:center;
}
.bar > *{pointer-events:auto}
.pill{
  height:44px;min-width:44px;padding:0 16px;border-radius:22px;
  border:1px solid var(--line);background:rgba(19,35,26,.62);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  color:var(--ivory);display:inline-flex;align-items:center;justify-content:center;gap:8px;
  cursor:pointer;font-size:15px;transition:background .2s,border-color .2s;
}
.pill:hover{background:rgba(34,63,46,.8);border-color:var(--gold)}
.pill svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pill[aria-pressed="true"]{border-color:var(--blush);color:var(--blush)}

/* full-screen steps */
.screen{
  position:fixed;inset:0;z-index:10;overflow-y:auto;display:flex;flex-direction:column;text-align:center;
  padding:calc(70px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  transition:opacity .9s ease,visibility .9s;
}
.screen.off{opacity:0;visibility:hidden;pointer-events:none}
.screen .inner{margin:auto;width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:18px}

.eyebrow{font-size:14px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:500}
html[lang="ar"] .eyebrow{letter-spacing:0;font-size:17px;text-transform:none}
.names{display:flex;flex-direction:column;align-items:center;font-family:var(--disp);line-height:1.25}
.nm{font-size:clamp(58px,18vw,104px);color:var(--ivory);font-weight:700}
html[lang="en"] .nm{font-style:italic;font-weight:500;line-height:1}
.amp{font-size:clamp(26px,8vw,40px);color:var(--gold);font-style:italic;line-height:1.3}
.orn{display:flex;align-items:center;gap:14px;color:var(--gold)}
.orn::before,.orn::after{content:"";width:56px;height:1px;background:var(--line)}
.orn svg{width:18px;height:18px;fill:currentColor}
.date-line{font-size:19px;color:var(--ivory)}
.teaser{max-width:30ch;color:var(--ivory-dim);font-size:16px}
.small{font-size:14px;color:var(--ivory-dim)}
.btn{
  border:0;cursor:pointer;border-radius:999px;padding:14px 38px;font-weight:500;font-size:18px;
  background:var(--blush);color:var(--ink);transition:transform .2s,background .2s;
}
.btn:hover{transform:translateY(-2px);background:#f3c8d0}
.btn.glow{animation:glow 2.8s ease-in-out infinite}
.btn.dark{background:var(--ink);color:var(--ivory)}
.btn.dark:hover{background:#2b4636}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--gold-deep)}
.btn.ghost:hover{background:rgba(31,50,38,.06)}
.btn.sm{padding:10px 22px;font-size:15px}
.link{background:none;border:0;cursor:pointer;color:var(--ivory-dim);text-decoration:underline;text-underline-offset:4px;font-size:14px;padding:6px}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(235,183,193,.4)}50%{box-shadow:0 0 0 14px rgba(235,183,193,0)}}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.screen:not(.off) .a{animation:up 1s cubic-bezier(.2,.7,.2,1) both}
.screen:not(.off) .a1{animation-delay:.1s}.screen:not(.off) .a2{animation-delay:.3s}.screen:not(.off) .a3{animation-delay:.55s}
.screen:not(.off) .a4{animation-delay:.8s}.screen:not(.off) .a5{animation-delay:1.05s}.screen:not(.off) .a6{animation-delay:1.3s}

/* maze */
.maze-title{font-family:var(--disp);font-size:clamp(30px,8vw,42px);line-height:1.4;color:var(--ivory);font-weight:700}
html[lang="en"] .maze-title{font-style:italic;font-weight:500;line-height:1.15}
.card-maze{padding:10px;border-radius:22px;border:1px solid var(--line);background:rgba(247,239,230,.045);box-shadow:0 22px 60px rgba(0,0,0,.3)}
#maze{display:block;touch-action:none;cursor:grab;border-radius:14px}
#maze:active{cursor:grabbing}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.win{font-family:var(--disp);font-size:26px;color:var(--blush);line-height:1.5}
html[lang="en"] .win{font-style:italic}

/* invitation */
#invite{position:relative;z-index:1;max-width:640px;margin:0 auto;padding-top:calc(74px + env(safe-area-inset-top,0px))}
.sec{padding-block:44px;text-align:center}
.arch{
  width:min(74vw,290px);aspect-ratio:3/4;margin:0 auto 30px;border-radius:999px 999px 26px 26px;overflow:hidden;
  box-shadow:0 0 0 1px var(--line),0 0 0 9px rgba(19,35,26,1),0 0 0 10px var(--line),0 26px 60px rgba(0,0,0,.4);
}
.arch img{width:100%;height:100%;object-fit:cover;object-position:52% 40%;display:block}
.invite-line{color:var(--ivory-dim);margin-bottom:6px;font-size:17px}
.hero-date{font-family:var(--disp);font-size:clamp(26px,7vw,34px);color:var(--ivory);margin-top:12px}
html[lang="en"] .hero-date{font-style:italic}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:400px;margin:26px auto 0}
.cd{border:1px solid var(--line);border-radius:16px;padding:12px 4px 8px;background:rgba(247,239,230,.04)}
.cd b{display:block;font-size:30px;font-weight:500;line-height:1.3;font-variant-numeric:tabular-nums;color:var(--blush)}
.cd span{font-size:13px;color:var(--ivory-dim)}
.count-note{margin-top:16px;font-family:var(--disp);font-size:22px;color:var(--blush)}
.verse{font-family:var(--f-ar-d);font-size:clamp(22px,5.4vw,28px);line-height:2;color:var(--ivory);max-width:26em;margin:0 auto}
.verse-en{margin-top:14px;font-family:var(--f-en-d);font-style:italic;font-size:19px;line-height:1.55;color:var(--ivory-dim);max-width:30em;margin-inline:auto}
.verse-src{margin-top:12px;font-size:14px;color:var(--gold)}
h2.h{font-family:var(--disp);font-size:clamp(30px,8vw,40px);font-weight:700;line-height:1.4;margin-bottom:6px}
html[lang="en"] h2.h{font-style:italic;font-weight:500;line-height:1.15}
.h-sub{color:var(--ivory-dim);margin-bottom:24px;font-size:16px}
a.btn{text-decoration:none;display:inline-block}
.paper{color-scheme:light;position:relative;background:var(--paper);color:var(--ink);border-radius:26px;padding:34px 24px 30px;text-align:start;box-shadow:0 24px 70px rgba(0,0,0,.38)}
.paper::before{content:"";position:absolute;inset:8px;border:1px solid rgba(201,166,107,.55);border-radius:19px;pointer-events:none}
.paper h2.h{color:var(--ink);text-align:center}
.paper .h-sub{color:var(--ink-dim);text-align:center}
.rows{display:grid;margin:8px 0 22px}
.rw{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid rgba(31,50,38,.13)}
.rw:first-child{border-top:0}
.rw dt{color:var(--gold-deep);font-size:14px;font-weight:500;padding-top:3px}
.rw dd{margin:0;font-size:18px;line-height:1.6}
.rw dd.tbd{color:var(--ink-dim);font-size:16px}
.paper .row-btns{justify-content:center}

/* gallery */
.gal{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:4/5;max-width:520px;margin:0 auto;background:#0d1812;box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.4)}
.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;position:relative;scroll-snap-align:center;margin:0;overflow:hidden}
.slide .bgi{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(24px) brightness(.55) saturate(1.2)}
.slide img{position:relative;display:block;width:100%;height:100%;object-fit:contain}
.nav{
  position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid rgba(247,239,230,.35);
  background:rgba(19,35,26,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--ivory);cursor:pointer;display:grid;place-items:center;z-index:2;
}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
html[dir="rtl"] .nav svg{transform:scaleX(-1)}
.nav.prev{inset-inline-start:10px}.nav.next{inset-inline-end:10px}
.dots{display:flex;justify-content:center;gap:8px;margin-top:16px}
.dots button{width:9px;height:9px;padding:0;border-radius:50%;border:0;background:rgba(247,239,230,.3);cursor:pointer;transition:all .3s}
.dots button[aria-current="true"]{background:var(--blush);width:26px;border-radius:5px}

/* rsvp */
form{display:grid;gap:20px}
label.fl,.fl{display:block;font-size:15px;font-weight:500;margin-bottom:8px;color:var(--ink)}
.in{width:100%;border:1px solid #d6c8b4;background:#fffdf9;border-radius:14px;padding:13px 15px;font:inherit;font-size:17px;color:var(--ink);line-height:1.5}
.in:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
textarea.in{min-height:96px;resize:vertical}
fieldset{border:0;margin:0;padding:0;min-width:0}
.choice{display:grid;gap:10px}
.choice label{display:flex;align-items:center;gap:12px;border:1px solid #d6c8b4;background:#fffdf9;border-radius:14px;padding:13px 15px;cursor:pointer;font-size:17px;transition:border-color .2s,background .2s}
.choice input{accent-color:var(--rose);width:20px;height:20px;margin:0;flex:none}
.choice label:has(input:checked){border-color:var(--rose);background:#fbeef0}
.stepper{display:inline-flex;align-items:center;gap:0;border:1px solid #d6c8b4;border-radius:14px;background:#fffdf9;overflow:hidden}
.stepper button{width:48px;height:48px;border:0;background:transparent;cursor:pointer;font-size:24px;color:var(--ink)}
.stepper button:hover{background:#f3e9da}
.stepper output{min-width:54px;text-align:center;font-size:20px;font-variant-numeric:tabular-nums}
.err{color:#9a2c43;font-size:15px;min-height:1.4em}
.reply{display:grid;gap:14px;text-align:center}
.reply textarea{width:100%;min-height:120px;border:1px solid #d6c8b4;border-radius:14px;background:#fffdf9;padding:13px 15px;font:inherit;font-size:16px;color:var(--ink);line-height:1.7;text-align:start}
.reply .note{color:var(--ink-dim);font-size:15px}
.reply a.btn{text-decoration:none;display:inline-block}
footer.end{padding:48px 0 calc(56px + env(safe-area-inset-bottom,0px));text-align:center}
footer.end .names2{font-family:var(--disp);font-size:34px;color:var(--ivory)}
html[lang="en"] footer.end .names2{font-style:italic}
footer.end .d{margin-top:6px;color:var(--gold);letter-spacing:.2em;font-size:14px}

/* reveal */
.rise{transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.rise.pre{opacity:0;transform:translateY(26px)}
body.open .ha{animation:up 1s cubic-bezier(.2,.7,.2,1) both}
body.open .ha1{animation-delay:.2s}body.open .ha2{animation-delay:.45s}body.open .ha3{animation-delay:.7s}body.open .ha4{animation-delay:.95s}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
@media (max-width:380px){.rw{grid-template-columns:1fr;gap:2px}.cd b{font-size:26px}}
</style>

<audio id="song" src="./song.mp3" loop preload="metadata"></audio>
<canvas class="fx" id="petals" aria-hidden="true"></canvas>
<canvas class="fx" id="burst" aria-hidden="true"></canvas>

<div class="bar">
  <button class="pill" id="musicBtn" type="button" aria-pressed="false" data-aria="musicLabel">
    <svg id="icOn" viewBox="0 0 24 24" hidden><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    <svg id="icOff" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></svg>
  </button>
  <button class="pill" id="langBtn" type="button"></button>
</div>

<!-- 1. intro -->
<section class="screen" id="intro" aria-labelledby="introNames">
  <div class="inner">
    <p class="eyebrow a a1" data-t="eyebrow"></p>
    <h1 class="names a a2" id="introNames"><span class="nm" data-t="groom"></span><span class="amp">&amp;</span><span class="nm" data-t="bride"></span></h1>
    <div class="orn a a3"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
    <p class="date-line a a3" data-t="dateLine"></p>
    <p class="teaser a a4" data-t="teaser"></p>
    <button class="btn glow a a5" id="startBtn" type="button" data-t="start"></button>
    <p class="small a a6" data-t="soundNote"></p>
    <button class="link a a6" id="skipBtn" type="button" hidden data-t="skip"></button>
  </div>
</section>

<!-- 2. maze -->
<section class="screen off" id="mazeScr" aria-labelledby="mazeTitle">
  <div class="inner">
    <h2 class="maze-title a a1" id="mazeTitle" data-t="mazeTitle"></h2>
    <p class="small a a2" id="mazeHelp" data-t="mazeHelp" style="max-width:32ch"></p>
    <p class="win" id="winMsg" role="status" hidden></p>
    <div class="card-maze a a3"><canvas id="maze" aria-label="maze"></canvas></div>
    <div class="row-btns a a4">
      <button class="pill" id="hintBtn" type="button" data-t="hint"></button>
      <button class="pill" id="resetBtn" type="button" data-t="reset"></button>
    </div>
  </div>
</section>

<!-- 3. invitation -->
<main id="invite" hidden>
  <section class="sec" style="padding-top:12px">
    <div class="arch ha ha1"><img src="./img/g4.jpg" alt="" data-alt="1"></div>
    <p class="invite-line ha ha2" data-t="inviteLine"></p>
    <h2 class="names ha ha2" style="margin-top:4px"><span class="nm" data-t="groom"></span><span class="amp">&amp;</span><span class="nm" data-t="bride"></span></h2>
    <p class="hero-date ha ha3" data-t="fullDate"></p>
    <div class="count ha ha4" id="count" aria-live="off"></div>
    <p class="count-note" id="countNote" hidden></p>
  </section>

  <section class="sec rise">
    <div class="orn" style="justify-content:center;margin-bottom:22px"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
    <p class="verse" lang="ar" dir="rtl">وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً</p>
    <p class="verse-src" data-t="verseSrc"></p>
    <p class="verse-en" lang="en" dir="ltr" id="verseEn"></p>
  </section>

  <section class="sec rise">
    <div class="paper">
      <h2 class="h" data-t="detailsH"></h2>
      <dl class="rows">
        <div class="rw"><dt data-t="lDate"></dt><dd data-t="fullDate"></dd></div>
        <div class="rw"><dt data-t="lTime"></dt><dd id="vTime"></dd></div>
        <div class="rw"><dt data-t="lVenue"></dt><dd id="vVenue"></dd></div>
      </dl>
      <div class="row-btns">
        <a class="btn dark sm" id="calLink" target="_blank" rel="noopener" data-t="addCal"></a>
        <a class="btn ghost sm" id="mapLink" target="_blank" rel="noopener" data-t="openMap" hidden></a>
      </div>
    </div>
  </section>

  <section class="sec rise">
    <h2 class="h" data-t="galH"></h2>
    <p class="h-sub" data-t="galSub"></p>
    <div class="gal" id="gal">
      <div class="track" id="track" tabindex="0">
        <figure class="slide"><div class="bgi" style="background-image:url(./img/g1.jpg)"></div><img src="./img/g1.jpg" alt="" data-alt="1" loading="lazy"></figure>
        <figure class="slide"><div class="bgi" style="background-image:url(./img/g2.jpg)"></div><img src="./img/g2.jpg" alt="" data-alt="2" loading="lazy"></figure>
        <figure class="slide"><div class="bgi" style="background-image:url(./img/g3.jpg)"></div><img src="./img/g3.jpg" alt="" data-alt="3" loading="lazy"></figure>
        <figure class="slide"><div class="bgi" style="background-image:url(./img/g4.jpg)"></div><img src="./img/g4.jpg" alt="" data-alt="4" loading="lazy"></figure>
        <figure class="slide"><div class="bgi" style="background-image:url(./img/g5.jpg)"></div><img src="./img/g5.jpg" alt="" data-alt="5" loading="lazy"></figure>
      </div>
      <button class="nav prev" id="prev" type="button" data-aria="prevLabel"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
      <button class="nav next" id="next" type="button" data-aria="nextLabel"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
    </div>
    <div class="dots" id="dots"></div>
  </section>

  <section class="sec rise">
    <div class="paper">
      <h2 class="h" data-t="rsvpH"></h2>
      <p class="h-sub" data-t="rsvpSub"></p>
      <form id="rsvpForm" novalidate>
        <div>
          <label class="fl" for="rsvp-name" data-t="fName"></label>
          <input class="in" id="rsvp-name" name="name" type="text" autocomplete="name" maxlength="80" required>
        </div>
        <fieldset>
          <legend class="fl" data-t="fAttend"></legend>
          <div class="choice">
            <label><input type="radio" name="att" id="att-yes" value="yes" checked><span data-t="yes"></span></label>
            <label><input type="radio" name="att" id="att-no" value="no"><span data-t="no"></span></label>
          </div>
        </fieldset>
        <div id="guestsBox">

function mkPetal(init){
  return {x:Math.random()*VW,y:init?Math.random()*VH:-20,s:6+Math.random()*8,vy:16+Math.random()*26,vx:-6+Math.random()*12,
    r:Math.random()*6.28,vr:(Math.random()-.5)*1.5,sw:Math.random()*6.28,c:PCOL[(Math.random()*PCOL.length)|0],a:.3+Math.random()*.4};

}

    hearts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,s:5+Math.random()*9,life:0,max:1.8+Math.random()*1.2,
      c:PCOL[(Math.random()*3)|0]==="#FFFFFF"?"#EBB7C1":["#EBB7C1","#D98294","#F3C9D1","#C9A66B"][(Math.random()*4)|0]});
  }
}
function stepFx(dt,t){

    var p=petals[i];p.sw+=dt*1.2;p.x+=(p.vx+Math.sin(p.sw)*14)*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;

/* ---- maze ---- */
var COLS=8,ROWS=11,PAD=8;
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var cells=[];
(function build(){
  var r=rng(2410),i;
  for(i=0;i<COLS*ROWS;i++)cells.push({N:1,E:1,S:1,W:1,v:0});
  var st=[0];cells[0].v=1;
  while(st.length){
    var c=st[st.length-1],x=c%COLS,y=(c/COLS)|0,nb=[];
    if(y>0&&!cells[c-COLS].v)nb.push(["N",c-COLS,"S"]);
    if(x<COLS-1&&!cells[c+1].v)nb.push(["E",c+1,"W"]);
    if(y<ROWS-1&&!cells[c+COLS].v)nb.push(["S",c+COLS,"N"]);
    if(x>0&&!cells[c-1].v)nb.push(["W",c-1,"E"]);
    if(!nb.length){st.pop();continue}
    var pick=nb[(r()*nb.length)|0];
    cells[c][pick[0]]=0;cells[pick[1]][pick[2]]=0;cells[pick[1]].v=1;st.push(pick[1]);
  }
})();
function canMove(x,y,dx,dy){
  var c=cells[y*COLS+x];
  if(dx===1)return !c.E;if(dx===-1)return !c.W;if(dy===1)return !c.S;if(dy===-1)return !c.N;return false;
}
function solve(sx,sy){
  var goal=COLS*ROWS-1,prev={},q=[sy*COLS+sx],seen={};seen[q[0]]=1;
  var D=[[1,0],[-1,0],[0,1],[0,-1]];
  while(q.length){
    var c=q.shift();if(c===goal)break;
    var x=c%COLS,y=(c/COLS)|0;
    for(var k=0;k<4;k++){
      var dx=D[k][0],dy=D[k][1];
      if(canMove(x,y,dx,dy)){var n=(y+dy)*COLS+x+dx;if(!seen[n]){seen[n]=1;prev[n]=c;q.push(n)}}
    }
  }
  var path=[],cur=goal;while(cur!==undefined&&cur!==sy*COLS+sx){path.push([cur%COLS,(cur/COLS)|0]);cur=prev[cur]}
  path.push([sx,sy]);return path.reverse();
}
var cv=$("#maze"),ctx=cv.getContext("2d"),cs=40,CW=0,CH=0;
var imgG=new Image(),imgB=new Image();imgG.src="./img/groom.jpg";imgB.src="./img/bride.jpg";

}

  cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
}
function ccx(x){return PAD+(x+.5)*cs}

  ctx.restore();
}
function drawMaze(t,dt){
  var k=1-Math.exp(-dt*16);ax+=(cx-ax)*k;ay+=(cy-ay)*k;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,CW,CH);

    ctx.stroke();ctx.restore();
  }

  ctx.save();ctx.strokeStyle=col.wall;ctx.lineWidth=Math.max(2,cs*.07);ctx.shadowColor="rgba(235,183,193,.45)";ctx.shadowBlur=6;ctx.beginPath();

function step(dx,dy){
  if(won||!canMove(cx,cy,dx,dy))return false;

  if(cx===COLS-1&&cy===ROWS-1)win();
  return true;
}
function toward(tx,ty){
  var guard=0;
  while((cx!==tx||cy!==ty)&&guard++<10&&!won){
    var ddx=tx-cx,ddy=ty-cy,sx=Math.sign(ddx),sy=Math.sign(ddy);

    for(var i=0;i<2;i++){var m=order[i];if((m[0]||m[1])&&step(m[0],m[1])){moved=true;break}}

  var r=cv.getBoundingClientRect();

}
var dragging=false;
cv.addEventListener("pointerdown",function(e){dragging=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}var c=pointerCell(e);toward(c[0],c[1])});
cv.addEventListener("pointermove",function(e){if(!dragging)return;var c=pointerCell(e);toward(c[0],c[1])});
["pointerup","pointercancel"].forEach(function(n){cv.addEventListener(n,function(){dragging=false})});
document.addEventListener("keydown",function(e){
  if(!mazeActive)return;
  var m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
  if(m){e.preventDefault();step(m[0],m[1])}
});
$("#hintBtn").addEventListener("click",function(){hintPath=solve(cx,cy);hintUntil=performance.now()+4500});
$("#resetBtn").addEventListener("click",function(){if(won)return;cx=cy=0;ax=ay=0;trail=[[0,0]];hintPath=null});

var inviteOpen=false;
function win(){
  won=true;
  setTimeout(function(){
    var r=cv.getBoundingClientRect();
    burstAt(r.left+ccx(COLS-1),r.top+ccx(ROWS-1));
    var w=$("#winMsg");w.textContent=T[lang].winMsg;w.hidden=false;$("#mazeHelp").hidden=true;
    try{localStorage.setItem("solved","1")}catch(e){}
  },380);
  setTimeout(function(){burstAt(window.innerWidth/2,window.innerHeight*.55)},1300);
  setTimeout(openInvite,3300);
}

/* ---- flow ---- */
var intro=$("#intro"),mazeScr=$("#mazeScr");
function showMaze(){
  intro.classList.add("off");mazeScr.classList.remove("off");mazeActive=true;layoutMaze();
}
$("#startBtn").addEventListener("click",function(){setMusic(true);showMaze()});
try{if(localStorage.getItem("solved")==="1")$("#skipBtn").hidden=false}catch(e){}
$("#skipBtn").addEventListener("click",function(){setMusic(true);openInvite()});

function openInvite(){
  if(inviteOpen)return;inviteOpen=true;mazeActive=false;
  intro.classList.add("off");mazeScr.classList.add("off");
  $("#invite").hidden=false;document.body.classList.add("open");
  window.scrollTo(0,0);
  buildCountShell();renderCount();setInterval(renderCount,1000);
  setupReveal();setupGallery();
}

/* ---- countdown ---- */
var target=new Date(EVENT.startISO).getTime();
function buildCountShell(){
  var d=T[lang],box=$("#count");if(!box)return;
  var keys=["cdD","cdH","cdM","cdS"];
  box.innerHTML="";
  keys.forEach(function(k){var c=document.createElement("div");c.className="cd";c.innerHTML="<b>0</b><span></span>";c.lastChild.textContent=d[k];box.appendChild(c)});
}
function renderCount(){
  var box=$("#count"),note=$("#countNote");if(!box||!box.children.length)return;
  var now=Date.now(),diff=target-now,d=T[lang];
  if(diff<=0){
    box.hidden=true;note.hidden=false;note.textContent=(now<target+216e5)?d.today:d.after;return;
  }
  box.hidden=false;note.hidden=true;
  var s=Math.floor(diff/1000),dd=Math.floor(s/86400),hh=Math.floor(s%86400/3600),mm=Math.floor(s%3600/60),ss=s%60;
  var v=[dd,hh,mm,ss];
  for(var i=0;i<4;i++)box.children[i].firstChild.textContent=num(v[i],i>0);
}

/* ---- reveal ---- */
function setupReveal(){
  var els=$$(".rise");
  if(!("IntersectionObserver" in window))return;
  var io=new IntersectionObserver(function(en){
    en.forEach(function(e){if(e.isIntersecting){e.target.classList.remove("pre");io.unobserve(e.target)}});
  },{threshold:.1});
  els.forEach(function(el){
    if(el.getBoundingClientRect().top>window.innerHeight*.9){el.classList.add("pre");io.observe(el)}
  });
}

/* ---- gallery ---- */
var track=$("#track"),slides=$$(".slide"),dots=$("#dots"),galIdx=0,galVisible=false,galUser=false,galTimer=null;
function sgn(){return document.documentElement.dir==="rtl"?-1:1}
function jumpTo(i,smooth){
  galIdx=(i+slides.length)%slides.length;
  track.scrollTo({left:sgn()*galIdx*track.clientWidth,behavior:smooth?"smooth":"auto"});
  markDots();
}
function markDots(){
  $$("button",dots).forEach(function(b,i){if(i===galIdx)b.setAttribute("aria-current","true");else b.removeAttribute("aria-current")});
}
function setupGallery(){
  dots.innerHTML="";
  slides.forEach(function(_,i){
    var b=document.createElement("button");b.type="button";b.setAttribute("aria-label",String(i+1));
    b.addEventListener("click",function(){galUser=true;jumpTo(i,true)});dots.appendChild(b);
  });
  markDots();
  var t=null;
  track.addEventListener("scroll",function(){
    clearTimeout(t);t=setTimeout(function(){
      var w=track.clientWidth;if(!w)return;galIdx=Math.max(0,Math.min(slides.length-1,Math.round(Math.abs(track.scrollLeft)/w)));markDots();
    },60);
  },{passive:true});
  ["pointerdown","wheel","keydown","touchstart"].forEach(function(n){track.addEventListener(n,function(){galUser=true},{passive:true})});
  $("#prev").addEventListener("click",function(){galUser=true;jumpTo(galIdx-1,true)});
  $("#next").addEventListener("click",function(){galUser=true;jumpTo(galIdx+1,true)});
  track.addEventListener("keydown",function(e){
    if(e.key==="ArrowRight"){e.preventDefault();jumpTo(galIdx+sgn(),true)}
    if(e.key==="ArrowLeft"){e.preventDefault();jumpTo(galIdx-sgn(),true)}
  });
  if("IntersectionObserver" in window){
    new IntersectionObserver(function(en){galVisible=en[0].isIntersecting},{threshold:.5}).observe($("#gal"));
  }
  if(!RM)galTimer=setInterval(function(){if(galVisible&&!galUser&&!document.hidden)jumpTo(galIdx+1,true)},4500);
}

/* ---- RSVP ---- */
var guests=1;
function setGuests(n){guests=Math.max(1,Math.min(10,n));$("#gOut").textContent=num(guests)}
$("#gMinus").addEventListener("click",function(){setGuests(guests-1)});
$("#gPlus").addEventListener("click",function(){setGuests(guests+1)});
function attending(){return $("#att-yes").checked}
$$("input[name=att]").forEach(function(r){r.addEventListener("change",function(){$("#guestsBox").hidden=!attending()})});
var lastMsg="";
function buildReply(){
  var name=$("#rsvp-name").value.trim(),note=$("#rsvp-msg").value.trim();
  lastMsg=T[lang].msg({name:name,att:attending(),n:num(guests),note:note});
  $("#replyText").value=lastMsg;
  // WhatsApp normal links cannot send one message to several recipients automatically.
  // This single share action opens WhatsApp with the reply prefilled; the guest selects recipients and presses Send.
  var share=$("#waShareLink");
  share.href="https://wa.me/201062311669?text="+encodeURIComponent(lastMsg);
  share.textContent=T[lang].waShare;
}
$("#rsvpForm").addEventListener("submit",function(e){
  e.preventDefault();
  if(!$("#rsvp-name").value.trim()){$("#rsvpErr").textContent=T[lang].errName;$("#rsvp-name").focus();return}
  $("#rsvpErr").textContent="";buildReply();
  $("#rsvpForm").hidden=true;$("#reply").hidden=false;
});
$("#editBtn").addEventListener("click",function(){$("#reply").hidden=true;$("#rsvpForm").hidden=false;$("#rsvp-name").focus()});
$("#copyBtn").addEventListener("click",function(){
  var b=$("#copyBtn"),ta=$("#replyText");
  function done(ok){b.textContent=ok?T[lang].copied:T[lang].copyManual;if(!ok){ta.focus();ta.select()}setTimeout(function(){b.textContent=T[lang].copy},2200)}
  try{navigator.clipboard.writeText(lastMsg).then(function(){done(true)},function(){done(false)})}catch(e){done(false)}
});

/* ---- boot ---- */
applyLang(lang);setGuests(1);readCols();sizeFx();initPetals();layoutMaze();
var rt=null;
window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){sizeFx();initPetals();layoutMaze();if(inviteOpen)jumpTo(galIdx)},150)});
var last=performance.now();
function loop(t){
  var dt=Math.min(.05,(t-last)/1000);last=t;
  if(!document.hidden){stepFx(dt,t);if(mazeActive||(won&&!inviteOpen))drawMaze(t,dt)}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
